name: quality-gate

on:
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'packages/eval/src/**'

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run quality gate CI
        id: gates
        run: |
          exit_code=$(node -e "
            const { checkQualityGates } = require('./packages/core/dist/src/quality-gate-ci.js');
            process.exit(checkQualityGates());
          ")
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
    outputs:
      exit_code: ${{ steps.gates.outputs.exit_code }}

  quality-gate-comment:
    needs: quality-gates
    runs-on: ubuntu-latest
    if: always()
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate quality gate report
        id: report
        run: |
          node -e "
            const { runQualityGates, generateCIReport } = require('./packages/core/dist/src/quality-gate-ci.js');
            const report = generateCIReport(runQualityGates());
            require('fs').writeFileSync('quality-gate-report.md', report);
            console.log('report_length=' + report.length);
          "
      - name: Post quality gate comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quality-gate-report.md', 'utf8');
            const exitCode = parseInt('${{ needs.quality-gates.outputs.exit_code }}', 10);
            const icon = exitCode === 0 ? '✓' : exitCode === 1 ? '⚠' : '✗';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Quality Gate CI**: ${icon} exit code ${exitCode}\n\n${report}`
            });
