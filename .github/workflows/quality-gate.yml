name: quality-gate

on:
  pull_request:
    paths:
      - 'packages/cli/src/**'
      - 'packages/cli/test/**'
      - 'packages/core/src/**'
      - 'packages/core/test/**'
      - 'packages/eval/src/**'
      - 'scripts/run-quality-gates-ci.mjs'
      - 'scripts/run-quality-gates-ci.test.mjs'
      - '.github/workflows/quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlunum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify migration CLI release gate
        run: node --test packages/cli/dist/test/cli.test.js
      - name: Verify renderer reference gate
        run: >-
          node --test
          packages/core/dist/test/profiles.test.js
          packages/core/dist/test/renderer-conformance.test.js
          packages/core/dist/test/renderer-golden-output.test.js
          packages/core/dist/test/renderer-profile-exact-goldens.test.js
      - name: Verify tokenizer optimization gate
        run: >-
          node --test
          packages/core/dist/test/token-atlas.test.js
          packages/core/dist/test/token-optimization.test.js
          packages/core/dist/test/token-optimization-compat.test.js
      - name: Run core tests A-D
        shell: bash
        run: |
          mapfile -t tests < <(find packages/core/dist/test -maxdepth 1 -type f -name '*.test.js' | sort | awk -F/ '$NF ~ /^[a-d]/')
          if ((${#tests[@]})); then node --test "${tests[@]}"; fi
      - name: Run core tests E-H
        shell: bash
        run: |
          mapfile -t tests < <(find packages/core/dist/test -maxdepth 1 -type f -name '*.test.js' | sort | awk -F/ '$NF ~ /^[e-h]/')
          if ((${#tests[@]})); then node --test "${tests[@]}"; fi
      - name: Run core tests I-L
        shell: bash
        run: |
          mapfile -t tests < <(find packages/core/dist/test -maxdepth 1 -type f -name '*.test.js' | sort | awk -F/ '$NF ~ /^[i-l]/')
          if ((${#tests[@]})); then node --test "${tests[@]}"; fi
      - name: Run core tests M-P
        shell: bash
        run: |
          mapfile -t tests < <(find packages/core/dist/test -maxdepth 1 -type f -name '*.test.js' | sort | awk -F/ '$NF ~ /^[m-p]/')
          if ((${#tests[@]})); then node --test "${tests[@]}"; fi
      - name: Run core tests Q-T
        shell: bash
        run: |
          mapfile -t tests < <(find packages/core/dist/test -maxdepth 1 -type f -name '*.test.js' | sort | awk -F/ '$NF ~ /^[q-t]/')
          if ((${#tests[@]})); then node --test "${tests[@]}"; fi
      - name: Run core tests U-Z
        shell: bash
        run: |
          mapfile -t tests < <(find packages/core/dist/test -maxdepth 1 -type f -name '*.test.js' | sort | awk -F/ '$NF ~ /^[u-z]/')
          if ((${#tests[@]})); then node --test "${tests[@]}"; fi
      - name: Run complete CLI test suite
        run: pnpm --filter @corpunum/lunum-cli test:unit
      - name: Run complete eval test suite
        run: pnpm --filter @corpunum/lunum-eval test:unit
      - name: Run quality gate CI
        id: gates
        env:
          QUALITY_GATE_STRICT: '0'
        # The repository currently has no committed protected record fixtures.
        # Keep this synthetic smoke mode explicit; remove it when fixtures land.
        run: node scripts/run-quality-gates-ci.mjs --fallback-only
      - name: Quality gate result
        run: echo "Quality gates completed with gate exit code ${{ steps.gates.outputs.gate_exit_code }} over ${{ steps.gates.outputs.record_count }} record(s)"
