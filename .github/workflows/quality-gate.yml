name: quality-gate

on:
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'packages/eval/src/**'
      - 'scripts/run-quality-gates-ci.mjs'
      - '.github/workflows/quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlunum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run quality gate CI
        id: gates
        env:
          QUALITY_GATE_STRICT: '0'
        # The repository currently has no committed protected record fixtures.
        # Keep this synthetic smoke mode explicit; remove it when fixtures land.
        run: node scripts/run-quality-gates-ci.mjs --fallback-only
      - name: Quality gate result
        run: echo "Quality gates completed with gate exit code ${{ steps.gates.outputs.gate_exit_code }} over ${{ steps.gates.outputs.record_count }} record(s)"
