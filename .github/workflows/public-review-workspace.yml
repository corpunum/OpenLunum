name: Public review workspace

on:
  push:
    branches: [review/public-usability-and-license-20260914]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Archive tracked public source and validation dependencies
        run: |
          git archive --format=tar.gz --output=source.tar.gz HEAD
          tar -czf runtime.tar.gz node_modules packages/*/node_modules packages/*/dist
      - uses: actions/upload-artifact@v4
        with:
          name: public-review-source
          path: |
            source.tar.gz
            runtime.tar.gz
          retention-days: 1
