name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlunum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Keep the full log: the 5,000-line tail in the UI hid the name of an
      # intermittent packages/eval failure (HANDOVER.md, next step 2).
      - name: pnpm verify (full log kept)
        shell: bash
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee verify.log
      - name: Name failing tests
        if: failure()
        shell: bash
        run: |
          {
            echo '### Failing tests'
            echo '```'
            grep -nE '^\s*not ok |^✖ |# fail [1-9]' verify.log | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full verify log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: verify.log
          retention-days: 14

  schema-drift:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/schema-to-ts.cjs --dry-run
      - run: npx tsc --noEmit --skipLibCheck packages/core/src/types-schema-conformance.ts

  report-validation:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm eval:smoke
      - name: Run report validation on smoke test output
        run: |
          node scripts/validate-report.cjs reports/experiments/smoke-test --repo-root . --expected-integrity $(node -e "const fs=require('fs'),crypto=require('crypto');const s=JSON.parse(fs.readFileSync('reports/experiments/smoke-test/summary.json'));const l=fs.readFileSync('reports/experiments/smoke-test/item-results.jsonl','utf8').trim().split('\n').filter(x=>x.trim());console.log(crypto.createHash('sha256').update(JSON.stringify({summary:s,itemCount:l.length})).digest('hex'))")
      - name: Run report validation tests
        run: node --test packages/eval/dist/test/report-validation.test.js
