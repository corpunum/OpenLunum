name: rust

on:
  pull_request:
    paths:
      - "crates/**"
      - "tools/pivot-miner/**"
      - "eval-results/golden-vectors/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/pivot-miner/**"
      - "eval-results/golden-vectors/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/lunum-sem/target
            crates/lunum-store/target
            tools/pivot-miner/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/*/Cargo.lock', 'tools/pivot-miner/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: cargo test --locked (each crate; benches stay ignored)
        run: |
          set -e
          for dir in crates/lunum-sem crates/lunum-store tools/pivot-miner; do
            echo "::group::$dir"
            (cd "$dir" && cargo test --locked)
            echo "::endgroup::"
          done
