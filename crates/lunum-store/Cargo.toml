[package]
name = "lunum-store"
version = "0.1.0"
edition = "2021"
description = "Append-only SQLite record store keyed by the Lunum lfp:2.1 semantic fingerprint"
license = "Apache-2.0"
publish = false

# Standalone crate: not part of any parent workspace.
[workspace]

[dependencies]
lunum-sem = { path = "../lunum-sem" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"

[lib]
name = "lunum_store"
path = "src/lib.rs"

[[bin]]
name = "lunum-store"
path = "src/bin/lunum-store.rs"
